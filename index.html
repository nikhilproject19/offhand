<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offhand</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17132C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23E5383B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Offhand: a night out shot on a disposable camera. Deep indigo night, flash-white paper,
   REC red for anything live, and an amber seven-segment date stamp burned into every photo.
   Layout: one phone-width column; on a computer it stands in the middle of a night backdrop. */
:root{
  --paper:#F4F2F7; --card:#FFFFFF; --ink:#1C1830; --ink-2:#4B4662; --muted:#7B758E; --line:#E4E0EB; --line-2:#CDC8DA;
  --rec:#E5383B; --rec-soft:#FDE7E7; --stamp:#FF9F2E; --warn:#93560B; --warn-soft:#FFF1DC;
  --night:#17132C; --night-2:#231E3F; --night-3:#2F2952; --night-line:#3B3462; --on-night:#F6F4FB; --on-night-2:#B8B2CD;
  --backdrop:#0E0B1E;
  --shadow:0 1px 2px rgba(28,24,48,.06),0 10px 28px rgba(28,24,48,.08);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#100D1E; --card:#1B172F; --ink:#F3F1F9; --ink-2:#CBC5DC; --muted:#9791AE; --line:#2A2544; --line-2:#3B355B;
    --rec:#FF5256; --rec-soft:#3A1B26; --warn:#F2B75E; --warn-soft:#382A15;
    --night:#0C0A18; --night-2:#18142D; --night-3:#231E40; --night-line:#322C54;
    --backdrop:#06050D;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body[data-tone="night"]{background:var(--night)}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rec);outline-offset:3px}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* the column, and the night backdrop around it on a computer */
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--paper)}
.app[data-tone="night"]{background:var(--night);color:var(--on-night)}
.screen{display:flex;flex-direction:column;gap:20px;min-height:100vh;min-height:100dvh;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.app[data-tabs] .screen{padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
.screen.enter{animation:enter .3s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.aside{display:none}
@media (min-width:600px){
  body,body[data-tone="night"]{background:
    radial-gradient(480px circle at 10% 16%,rgba(255,159,46,.17),transparent 70%),
    radial-gradient(560px circle at 92% 26%,rgba(229,56,59,.15),transparent 70%),
    radial-gradient(520px circle at 80% 90%,rgba(126,110,255,.17),transparent 70%),
    radial-gradient(420px circle at 16% 86%,rgba(70,200,220,.10),transparent 70%),
    var(--backdrop);background-attachment:fixed}
  .app{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 40px 120px rgba(0,0,0,.55)}
}
@media (min-width:1120px){
  .aside{display:flex;flex-direction:column;gap:14px;position:fixed;top:50%;transform:translateY(-50%);left:max(48px,calc(50% - 220px - 400px));width:320px;color:var(--on-night)}
  .aside .wordmark{font-size:2.4rem}
  .aside p{color:var(--on-night-2);font-size:1.05rem;line-height:1.5}
  .aside .eyebrow{color:var(--on-night-2)}
}

/* type */
h1,h2{font-family:var(--display);font-stretch:78%;font-weight:800;letter-spacing:-.005em;text-wrap:balance}
h1{font-size:2.55rem;line-height:.98}
h2{font-size:1.9rem;line-height:1.02}
h3{font-size:1.05rem;font-weight:600;line-height:1.3}
.mega{font-family:var(--display);font-stretch:72%;font-weight:800;font-size:clamp(2.8rem,13.5vw,3.8rem);line-height:.9;text-transform:uppercase;letter-spacing:-.005em}
.mega em{font-style:normal;color:var(--stamp)}
.lede{color:var(--ink-2);font-size:1.06rem;line-height:1.5}
.fine{color:var(--muted);font-size:.85rem;line-height:1.45}
.eyebrow{display:flex;align-items:center;gap:7px;font:500 .72rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow.hot{color:var(--stamp)}
.app[data-tone="night"] .lede,.app[data-tone="night"] .fine,.app[data-tone="night"] .eyebrow:not(.hot){color:var(--on-night-2)}
.wordmark{display:inline-flex;align-items:center;gap:9px;font:800 1.45rem/1 var(--display);font-stretch:80%;letter-spacing:-.01em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rec);display:inline-block;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--rec) 22%,transparent)}
.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.intro{display:flex;flex-direction:column;gap:10px}
.push{margin-top:auto}

/* buttons */
.btn{appearance:none;border:0;border-radius:999px;min-height:56px;padding:0 24px;font:600 1.02rem/1.2 var(--body);display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;cursor:pointer;transition:transform .12s ease,background-color .15s ease,opacity .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.secondary{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--rec)}
.btn.rec{background:var(--rec);color:#fff}
.btn.light{background:var(--on-night);color:#17132C}
.btn.ghost-night{background:transparent;color:var(--on-night-2);box-shadow:inset 0 0 0 1.5px var(--night-line)}
.btn.small{min-height:44px;font-size:.95rem;padding:0 18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.iconbtn{appearance:none;width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:inherit;flex:none}
.iconbtn:hover{background:color-mix(in srgb,currentColor 9%,transparent)}
.iconbtn.outline{width:56px;height:56px;box-shadow:inset 0 0 0 1.5px var(--line-2);color:var(--ink-2)}

/* step progress */
.stephead{display:flex;flex-direction:column;gap:12px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ink)}
.app[data-tone="night"] .steps i{background:var(--night-line)}
.app[data-tone="night"] .steps i.on{background:var(--on-night)}

/* rules lists */
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.rules li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.rules .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.app[data-tone="night"] .rules .ico{background:var(--night-2);color:var(--on-night);box-shadow:none}
.rules b{display:block;font-weight:600;line-height:1.3}
.rules span{display:block;color:var(--ink-2);font-size:.93rem;line-height:1.45;margin-top:2px}
.app[data-tone="night"] .rules span{color:var(--on-night-2)}

/* welcome */
.hero-art{position:relative;height:300px}
.hero-art .shot{position:absolute;left:2%;top:4px;width:56%;margin:0;border-radius:16px;overflow:hidden;transform:rotate(-5deg);box-shadow:0 0 0 6px #fff,0 24px 50px rgba(0,0,0,.5)}
.hero-art .shot img{aspect-ratio:4/5;object-fit:cover;width:100%}
.hero-art .bubble{position:absolute;right:0;bottom:6px;width:66%;transform:rotate(3deg);background:#fff;color:#1C1830;border-radius:18px;padding:14px 16px;box-shadow:0 24px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:6px}
.bubble .bq{font-size:.78rem;color:#7B758E;line-height:1.3}
.bubble .ba{font-size:.98rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bubble .chip{background:#F4F2F7;color:#4B4662}
.hero-art .rectag{position:absolute;right:6%;top:14px;display:inline-flex;align-items:center;gap:7px;font:700 .72rem/1 var(--mono);letter-spacing:.14em;color:var(--on-night);background:rgba(255,255,255,.08);padding:8px 11px;border-radius:999px}

/* forms */
.form{display:flex;flex-direction:column;gap:18px}
.two{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>span,.field legend{font-weight:600;font-size:.9rem;color:var(--ink-2);padding:0}
fieldset.field{border:0;margin:0;padding:0}
.input{border:1.5px solid var(--line);background:var(--card);border-radius:14px;height:54px;padding:0 16px;width:100%;font-size:1.02rem;color:var(--ink)}
.input:focus{border-color:var(--ink);outline:none}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label,.modes label{cursor:pointer}
.seg input,.modes input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;border-radius:999px;padding:11px 17px;font-weight:500;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.seg input:checked+span{background:var(--ink);color:var(--paper);box-shadow:none}
.seg input:focus-visible+span,.modes input:focus-visible+.mc{outline:2px solid var(--rec);outline-offset:2px}
.err{color:var(--rec);font-weight:500;min-height:1.4em;font-size:.92rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes .mc{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);height:100%}
.modes .mc .ic{margin-bottom:4px}
.modes input:checked+.mc{box-shadow:inset 0 0 0 2px var(--ink)}
.modes .mc b{font-weight:600}
.modes .mc small{color:var(--muted);font-size:.83rem;line-height:1.35}

/* photos */
.cam{position:relative;aspect-ratio:4/5;max-height:52vh;border-radius:24px;overflow:hidden;background:#05040A;max-width:100%}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam video{transform:scaleX(-1)}
.tag{position:absolute;top:14px;left:14px;z-index:1;display:inline-flex;align-items:center;gap:7px;background:rgba(10,8,22,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font:500 .66rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:7px 10px;border-radius:999px}
.camerr{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;color:var(--on-night-2);font-size:.95rem;line-height:1.5}
.camerr b{display:block;color:var(--on-night);font-size:1.05rem;margin-bottom:8px}
.shutterwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.shutter{appearance:none;width:80px;height:80px;border-radius:50%;border:0;background:transparent;box-shadow:inset 0 0 0 4px #fff;display:grid;place-items:center;cursor:pointer;padding:0}
.shutter::after{content:"";width:64px;height:64px;border-radius:50%;background:#fff;transition:transform .12s ease}
.shutter:active::after{transform:scale(.88)}
.shutter.send::after{background:var(--rec)}
.shutter:disabled{opacity:.35;cursor:wait}
.hint{font:500 .72rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-2)}
.portrait{position:relative;margin:0;border-radius:24px;overflow:hidden;aspect-ratio:4/5;background:var(--night-2);max-width:100%}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 46% at 0% 100%,rgba(10,8,22,.82),rgba(10,8,22,.35) 55%,transparent 100%);pointer-events:none}
.portrait figcaption{position:absolute;left:20px;bottom:18px;z-index:1;color:#fff;display:flex;flex-direction:column;gap:3px}
.portrait figcaption b{font:800 2.2rem/1 var(--display);font-stretch:78%}
.portrait figcaption span{font-size:.92rem;color:rgba(255,255,255,.82)}
.nophoto{aspect-ratio:4/5;border-radius:24px;border:1.5px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;color:var(--muted)}
.nophoto b{display:block;color:var(--ink);margin-bottom:4px}
.who{display:flex;flex-direction:column;gap:2px}
.who p{color:var(--muted)}

/* answers */
.answer{background:var(--card);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.aq{color:var(--muted);font-size:.9rem;font-weight:500;line-height:1.35}
.atext{font-size:1.16rem;line-height:1.42;overflow-wrap:anywhere}
.atext.none{color:var(--muted);font-style:italic;font-size:1rem}
.answer audio{width:100%;height:40px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{font-size:.74rem;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--paper);color:var(--ink-2);white-space:nowrap}
.chip.tc{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.72rem}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.solid{background:var(--card);box-shadow:var(--shadow)}
.twist{margin-top:4px;padding-top:14px;border-top:1px dashed var(--line-2);display:flex;flex-direction:column;gap:8px}
.twist .atext{font-size:1.05rem}
.likebtn{align-self:flex-end;display:inline-flex;align-items:center;gap:7px;border:0;background:var(--rec-soft);color:var(--rec);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;margin-top:2px;transition:background-color .15s ease,color .15s ease}
.likebtn .ic,.heart .ic{fill:currentColor;stroke:none}
.likebtn:hover{background:var(--rec);color:#fff}
.deckbar{display:flex;gap:10px;align-items:center}

/* questions */
.qbar{display:flex;align-items:center;justify-content:space-between;min-height:56px}
.live{display:inline-flex;align-items:center;gap:8px;font:700 .76rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--rec)}
.timecode{font:800 3.4rem/1 var(--display);font-stretch:72%;font-variant-numeric:tabular-nums;color:var(--on-night)}
.timecode.low{color:var(--rec)}
.bar{height:4px;border-radius:2px;background:var(--night-line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--on-night);transform-origin:left}
.bar.low i{background:var(--rec)}
.qtext{font-size:2.15rem;line-height:1.03}
.answerbox{background:var(--night-2);color:var(--on-night);border:0;border-radius:var(--r);padding:16px 18px;min-height:170px;width:100%;resize:none;font-size:1.15rem;line-height:1.45}
.answerbox::placeholder{color:var(--on-night-2);opacity:.75}
.answerbox:focus{outline:2px solid var(--night-line);outline-offset:0}
.qmeta{display:flex;justify-content:space-between;gap:10px;color:var(--on-night-2);font-size:.84rem}
.qmeta .flag{color:var(--stamp);font-weight:600;text-align:right}
.voice{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 16px;border-radius:var(--r);background:var(--night-2);text-align:center;color:var(--on-night-2)}
.voice b{color:var(--on-night)}
.wave{display:flex;align-items:center;gap:5px;height:56px}
.wave i{width:6px;height:14px;border-radius:3px;background:var(--rec);animation:wave 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:-.75s}.wave i:nth-child(3){animation-delay:-.3s}.wave i:nth-child(4){animation-delay:-.9s}
.wave i:nth-child(5){animation-delay:-.5s}.wave i:nth-child(6){animation-delay:-.15s}.wave i:nth-child(7){animation-delay:-.6s}
@keyframes wave{50%{height:52px}}
.recwrap{display:flex;flex-direction:column;align-items:center;gap:16px;margin:auto 0}
.recbtn{appearance:none;width:124px;height:124px;border-radius:50%;border:0;background:var(--rec);color:#fff;font:700 .82rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 0 0 7px var(--night),0 0 0 9px rgba(255,255,255,.2),0 20px 50px rgba(229,56,59,.45);transition:transform .12s ease}
.recbtn:active{transform:scale(.95)}
.recbtn:disabled{opacity:.6;cursor:wait}

/* match */
.pair{position:relative;height:270px}
.pair figure{position:absolute;top:0;width:50%;aspect-ratio:4/5;margin:0;border-radius:16px;overflow:hidden;background:var(--night-2);box-shadow:0 0 0 5px #fff,0 24px 50px rgba(0,0,0,.5);display:grid;place-items:center}
.pair figure img{width:100%;height:100%;object-fit:cover}
.pair .p1{left:4%;top:14px;transform:rotate(-6deg)}
.pair .p2{right:4%;transform:rotate(5deg)}
.pair .initial{font:800 4.5rem/1 var(--display);font-stretch:78%;color:var(--on-night-2)}
.heart{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--rec);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 5px var(--night),0 12px 30px rgba(229,56,59,.5)}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:12px 14px;border:0;background:var(--card);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);width:100%;text-align:left;cursor:pointer;min-width:0}
.item.static{cursor:default}
.item .txt{min-width:0;flex:1}
.item .txt b{display:block;font-weight:600}
.item .txt span{display:block;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item>.ic{color:var(--muted)}
.av{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--night-2)}
.av img{width:100%;height:100%;object-fit:cover}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:30px 20px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;display:flex;align-items:center;gap:14px;padding:14px;border:0;border-radius:18px;background:var(--paper);text-align:left;cursor:pointer;color:var(--ink);width:100%}
.opt:hover:not(:disabled){background:var(--line)}
.opt.card{background:var(--card);box-shadow:var(--shadow)}
.opt.card:hover:not(:disabled){background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1.5px var(--line-2)}
.opt .oi{width:42px;height:42px;border-radius:13px;background:var(--card);display:grid;place-items:center;flex:none}
.opt.card .oi{background:var(--paper)}
.opt b{display:block;font-weight:600}
.opt small{display:block;color:var(--muted);font-size:.84rem;line-height:1.35}
.opt:disabled{opacity:.55;cursor:not-allowed}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;z-index:5;
  background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 -1px 0 var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{flex:1;appearance:none;border:0;background:none;padding:4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabbar .tb{width:58px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background-color .15s ease}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] .tb{background:var(--paper)}
.tabbar .n{position:absolute;top:0;left:calc(50% + 10px);font:700 .62rem/1 var(--mono);background:var(--rec);color:#fff;border-radius:999px;padding:3px 6px}

/* chat */
.screen.chat{padding:0;gap:0;height:100vh;height:100dvh;min-height:0}
.chathead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--card);box-shadow:0 1px 0 var(--line);position:relative;z-index:1}
.chathead .av{width:42px;height:42px}
.chathead .txt{flex:1;min-width:0}
.chathead .txt b{display:block;font-weight:600;line-height:1.2}
.chathead .txt span{display:block;color:var(--muted);font-size:.8rem}
.msgs{flex:1;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.msg{max-width:80%;padding:10px 15px;border-radius:21px;overflow-wrap:anywhere;line-height:1.4}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--card);color:var(--ink);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.sys{align-self:center;max-width:92%;text-align:center;padding:4px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.msg.sys b{font:800 1.35rem/1.1 var(--display);font-stretch:80%;color:var(--ink);text-wrap:balance}
.msg.note{color:var(--muted);font-size:.86rem;padding:4px 10px}
.msg.media{padding:6px;width:min(240px,78%)}
.msg.media img{border-radius:16px;width:100%}
.msg.media audio{width:100%;display:block}
.msg .cap{display:block;font:500 .64rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:9px 8px 5px;opacity:.75}
.msg.ask{max-width:100%;align-self:stretch;display:flex;flex-direction:column;gap:14px;border-radius:21px;padding:16px}
.composer{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 -1px 0 var(--line)}
.cinput{flex:1;min-width:0;height:46px;border:0;border-radius:23px;background:var(--paper);color:var(--ink);padding:12px 16px;resize:none;font-size:1rem;line-height:1.35}
.cinput::placeholder{color:var(--muted)}
.cinput:focus{outline:2px solid var(--line-2);outline-offset:0}
.nowbtn{appearance:none;flex:none;height:46px;display:inline-flex;align-items:center;gap:8px;border:0;background:var(--paper);color:var(--ink);border-radius:23px;padding:0 15px;font-weight:600;cursor:pointer}
.sendbtn{appearance:none;flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(8,6,20,.55);z-index:20;animation:fade .15s ease}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);color:var(--ink);border-radius:28px 28px 0 0;z-index:21;display:flex;flex-direction:column;gap:12px;animation:rise .22s cubic-bezier(.2,.7,.2,1);
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);align-self:center;margin-bottom:6px}
.sheet h3{font:800 1.5rem/1.05 var(--display);font-stretch:80%}
.sheet .recline{display:flex;align-items:center;justify-content:space-between}
.sheet .timecode{color:var(--ink);font-size:2.6rem}
@keyframes rise{from{transform:translate(-50%,24px);opacity:0}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night-3);color:var(--on-night);padding:11px 18px;border-radius:999px;font-weight:500;font-size:.92rem;z-index:30;max-width:calc(100% - 40px);text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.3)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

// A: "What's something you <verb> <when>?" The third item lists times a verb doesn't suit.

// D: about this exact moment, so nobody can prepare. Some change with the day and time.
const NOW = [
  [t => `It's ${t.day} ${t.part}. What were you doing an hour ago?`, ['Was that the plan?', 'What should you have been doing?']],

// The amber seven-segment date stamp of a film camera, burned into the pixels of every photo.
const SEGS = { 0:'abcdef', 1:'bc', 2:'abdeg', 3:'abcdg', 4:'bcfg', 5:'acdfg', 6:'acdefg', 7:'abc', 8:'abcdefg', 9:'abcdfg' };
function segLayout(text, h){
  const W = h * 0.52, T = h * 0.13, G = h * 0.035, half = h / 2, v = half - T / 2 - 2 * G, rects = [];
  let x = 0;
  for (const ch of text) {
    if (SEGS[ch]) {
      const S = {
        a:[x + T + G, 0, W - 2 * T - 2 * G, T], g:[x + T + G, half - T / 2, W - 2 * T - 2 * G, T], d:[x + T + G, h - T, W - 2 * T - 2 * G, T],
        f:[x, T / 2 + G, T, v], b:[x + W - T, T / 2 + G, T, v], e:[x, half + G, T, v], c:[x + W - T, half + G, T, v]
      };
      for (const s of SEGS[ch]) rects.push(S[s]);
      x += W + h * 0.2;
    } else if (ch === ':') { rects.push([x, h * 0.26, T, T], [x, h * 0.62, T, T]); x += T + h * 0.2; }
    else if (ch === "'") { rects.push([x, 0, T, h * 0.3]); x += T + h * 0.18; }
    else x += h * 0.34;
  }

}
function stampText(ts){

}
function drawStamp(g, ts, W, H){

  g.save();
  g.setTransform(1, 0, -0.12, 1, x0 + h * 0.12, y0);   // the slight slant of an LED display
  g.fillStyle = '#FFB04A'; g.shadowColor = 'rgba(255,120,20,1)'; g.shadowBlur = h * 0.6;
  for (let pass = 0; pass < 2; pass++) for (const [x, y, w, hh] of rects) g.fillRect(x, y, w, hh);

}
function rng(seed){ let s = (seed >>> 0) || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

/* ---------- dealing questions ---------- */
function moment(){
  const d = new Date(), h = d.getHours();
  const part = h < 5 ? 'night' : h < 12 ? 'morning' : h < 17 ? 'afternoon' : h < 22 ? 'evening' : 'night';
  return { day:DAYS[d.getDay()], part, when: part === 'night' ? 'tonight' : `this ${part}` };
}
const textOf = it => typeof it.q === 'function' ? it.q(moment()) : it.q;
// A question you haven't had before, from one family if possible.
function draw(fam, also = []){
  const used = new Set([...S.seen, ...also]);
  let list = POOL.filter(it => it.fam === fam && !used.has(it.id));
  if (!list.length) list = POOL.filter(it => !used.has(it.id));
  return pick(list.length ? list : POOL);
}
function markSeen(id){ if (!S.seen.includes(id)) S.seen.push(id); }
// Three questions from three different families, always including one about right now.
function planOnboarding(mode){
  const a = Math.random() < 0.5 ? 'A' : 'E';
  const b = pick(['A', 'E', 'C'].filter(f => f !== a));
  const ids = [];
  for (const fam of ['D', a, b]) ids.push(draw(fam, ids).id);
  shuffle(ids);
  ids.forEach(markSeen);
  return { ids, twistAt: Math.floor(Math.random() * ids.length), mode };
}

/* ---------- no-paste guard ---------- */
function guard(el, onTry){
  let prev = el.value;
  const deny = e => { e.preventDefault(); if (onTry) onTry(); toast('Pasting is off. Type it yourself.'); };
  el.addEventListener('paste', deny);
  el.addEventListener('drop', deny);
  el.addEventListener('dragover', e => e.preventDefault());
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('beforeinput', e => { if (/^insertFrom(Paste|Drop|Yank)/.test(e.inputType || '')) deny(e); });
  el.addEventListener('input', e => {
    // A big jump in one event means text was injected rather than typed.
    if (el.value.length - prev.length > 30 && !e.isComposing) {
      el.value = prev;
      if (onTry) onTry();
      toast('That arrived all at once. Type it yourself.');
    }
    prev = el.value;
  });
}

/* ---------- render ---------- */
const AFTER = {
  photo(){ if (!P.shot && !P.error) startCam(); },
  question(){
    if (Q.phase !== 'live') return;
    const ans = $('#ans');
    if (!ans) return;
    guard(ans, () => { Q.pasteTries++; persistLive(); });
    ans.addEventListener('input', () => {
      Q.text = ans.value;
      $('#chars').textContent = `${ans.value.length} characters`;
      persistLive();
    });
    ans.focus();
  },
  chat(){
    const msg = $('#msg');
    if (draft && draft.id === chatId) msg.value = draft.text;
    draft = null;
    guard(msg);
    msg.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ACT.send(); } });
    const box = $('#msgs'), toEnd = () => { box.scrollTop = box.scrollHeight; };
    toEnd();
    // photos decode after the first layout; keep the newest message in view once they do
    box.querySelectorAll('img').forEach(img => { if (!img.complete) img.addEventListener('load', toEnd, { once:true }); });
  }
};
const themeColor = document.querySelector('meta[name="theme-color"]');

function render(){
  if (view !== 'photo') stopCam();
  const tabs = TABS.includes(view), tone = NIGHT.includes(view) ? 'night' : 'day';
  app.innerHTML = VIEWS[view]() + (tabs ? tabbar() : '') + (sheet ? sheetHtml() : '');
  app.dataset.view = view; app.dataset.tone = tone; document.body.dataset.tone = tone;
  if (tabs) app.dataset.tabs = '1'; else delete app.dataset.tabs;
  const screen = app.querySelector('.screen');
  if (screen && view !== lastView) screen.classList.add('enter');
  lastView = view;
  themeColor.content = getComputedStyle(document.documentElement).getPropertyValue(tone === 'night' ? '--night' : '--paper').trim();
  if (AFTER[view]) AFTER[view]();
  if (view !== 'chat') window.scrollTo(0, 0);
}
function keepDraft(){ const b = $('#msg'); if (b && chatId) draft = { id:chatId, text:b.value }; }
function go(to){
  if (V) endNote(true);
  if (view === 'chat') keepDraft();
  view = to; sheet = null;
  if (to !== 'me') resetArmed = false;
  render();
}
// Re-render without losing a half-typed chat message.
function redraw(){
  const box = $('#msg'), typing = !!box && document.activeElement === box;
  keepDraft();
  render();
  const next = $('#msg');
  if (typing && next && !sheet) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
}

/* ---------- camera ---------- */
async function startCam(){
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera API');
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:960} }, audio:false });
    const v = $('#vid');
    if (view !== 'photo' || !v || !P) { stream.getTracks().forEach(t => t.stop()); return; }
    P.stream = stream;
    v.srcObject = stream;
    v.addEventListener('loadedmetadata', () => { const b = $('#snap'); if (b) b.disabled = false; }, { once:true });
  } catch (e) {
    if (view === 'photo' && P) { P.error = true; render(); }
  }
}
function stopCam(){
  if (P && P.stream) { P.stream.getTracks().forEach(t => t.stop()); P.stream = null; }
}
// One shot. The photo is kept (or sent) the moment it's taken.
function snap(){
  const v = $('#vid');
  if (!P || P.shot || !v || !v.videoWidth) return;
  const chat = P.from === 'chat';
  const W = chat ? 540 : 720, H = chat ? 675 : 900, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const scale = Math.max(W / v.videoWidth, H / v.videoHeight);
  const sw = W / scale, sh = H / scale;
  ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);   // mirror, like the preview
  ctx.drawImage(v, (v.videoWidth - sw) / 2, (v.videoHeight - sh) / 2, sw, sh, 0, 0, W, H);
  ctx.restore();
  const at = Date.now();
  drawStamp(ctx, at, W, H);   // burned into the pixels, so it travels with the photo
  const shot = c.toDataURL('image/jpeg', chat ? 0.72 : 0.82);
  stopCam();
  if (chat) {
    const id = chatId;
    P = null;
    if (sendNow(id, { from:'me', kind:'photo', src:shot, at })) toast(`Sent to ${person(id).name}.`);
    go('chat');
    return;
  }
  S.me.photo = shot; S.me.photoAt = at;
  if (P.from === 'onboard') S.me.photoDone = true;
  save();
  P.shot = shot;
  render();
}

/* ---------- audio ---------- */
// One-take recorder, shared by spoken answers and chat voice notes.
async function recStart(){
  const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  try {
    const r = { stream, chunks:[], rec:new MediaRecorder(stream, { audioBitsPerSecond:24000 }) };
    r.rec.ondataavailable = e => { if (e.data.size) r.chunks.push(e.data); };
    r.rec.start();
    return r;
  } catch (e) {
    stream.getTracks().forEach(t => t.stop());
    throw e;
  }
}
function recStop(r){
  return new Promise(resolve => {
    r.rec.onstop = () => {
      const blob = new Blob(r.chunks, { type: r.rec.mimeType || 'audio/webm' });
      r.stream.getTracks().forEach(t => t.stop());
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => resolve('');
      fr.readAsDataURL(blob);
    };
    r.rec.stop();
  });
}

/* ---------- questions ---------- */
function askQuestion(opts){
  Q = Object.assign({ phase:'ready', part:'main', q:'', twistQ:'', limit:45, twistLimit:15, mode:'text', left:false, pasteTries:0, text:'', busy:false }, opts);
  view = 'question'; render();
}
function curLimit(){ return Q.part === 'twist' ? Q.twistLimit : Q.limit; }
function persistLive(){
  if (!Q || Q.phase !== 'live') return;
  saveLive({ ctx:Q.ctx, matchId:Q.matchId || null, openIdx: Q.openIdx == null ? null : Q.openIdx, q:Q.q, twistQ:Q.twistQ,
    mode:Q.mode, limit:Q.limit, twistLimit:Q.twistLimit, part:Q.part, start:Q.start, main:Q.main || null,
    text:Q.text, left:Q.left, pasteTries:Q.pasteTries });
}
async function qStart(){
  if (!Q || Q.phase !== 'ready' || Q.busy) return;
  Q.busy = true;
  if (Q.itemId) {
    const it = BY_ID.get(Q.itemId) || draw('E');
    Q.q = textOf(it);
    if (Q.withTwist) Q.twistQ = pick(it.f);
  }
  if (Q.mode === 'voice') {
    try { Q.vr = await recStart(); }
    catch (e) { Q.mode = 'text'; toast("The microphone isn't available. Type this one instead."); }
  }
  Q.phase = 'live'; Q.part = 'main'; Q.start = Date.now(); Q.text = ''; Q.busy = false;
  persistLive();
  render();
  Q.timer = setInterval(tick, 100);
}
function tick(){
  if (!Q || Q.phase !== 'live') return;
  const lim = curLimit(), left = Math.max(0, lim - (Date.now() - Q.start) / 1000);
  const secs = $('#secs'), bar = $('#bar');
  if (secs) {
    secs.textContent = fmtClock(Math.ceil(left));
    const low = left <= 10;
    secs.classList.toggle('low', low);
    $('#barwrap').classList.toggle('low', low);
    bar.style.transform = `scaleX(${left / lim})`;
  }
  if (left <= 0) finishQuestion(true);
}
async function finishQuestion(timedOut){
  if (!Q || Q.phase !== 'live' || Q.busy) return;
  Q.busy = true;
  clearInterval(Q.timer);
  const lim = curLimit();
  const used = Math.min(lim, Math.max(1, Math.round((Date.now() - Q.start) / 1000)));
  const ans = $('#ans');
  const part = { text: ans ? ans.value.trim() : '', secs:used, limit:lim, timedOut:!!timedOut };
  if (Q.part === 'main' && Q.twistQ) {
    // Straight into the follow-up: no pause, and a spoken answer keeps recording.
    Q.main = part; Q.part = 'twist'; Q.start = Date.now(); Q.text = ''; Q.busy = false;
    persistLive();
    render();
    Q.timer = setInterval(tick, 100);
    return;
  }
  const main = Q.part === 'twist' ? Q.main : part, follow = Q.part === 'twist' ? part : null;
  const audio = Q.mode === 'voice' && Q.vr ? await recStop(Q.vr) : '';
  const rec = { q:Q.q, mode:Q.mode, text:main.text, audio, secs:main.secs, limit:main.limit, timedOut:main.timedOut,
    left:Q.left, pasteTries:Q.pasteTries, at:Date.now(),
    twist: follow ? { q:Q.twistQ, text:follow.text, secs:follow.secs, limit:follow.limit, timedOut:follow.timedOut } : null };
  commit(Q.ctx, Q.matchId, Q.openIdx, rec);
  clearLive();
  Q.record = rec; Q.phase = 'locked';
  render();
}
// Store an answer the moment it locks, so there is nothing to go back to.
function commit(ctx, id, openIdx, rec){
  if (ctx === 'onboard' && S.me) {
    S.me.answers.push(rec);
    if (S.me.plan && S.me.answers.length >= S.me.plan.ids.length) S.me.ready = true;
  } else if (ctx === 'fresh' && S.me) {
    S.me.answers.unshift(rec);
  } else if (ctx === 'opening' && person(id)) {
    const p = person(id), o = p.openers[openIdx] || p.openers[0];
    S.chats[id] = { ri:0, msgs:[
      { from:'sys', text:rec.q },
      { from:'me', text: rec.text || (rec.cut ? '(left before answering)' : rec.timedOut ? '(no answer before the clock ran out)' : '(no answer)') },
      { from:'them', text:o.a }
    ]};
  }
  save();
}
// The page was closed or reloaded mid-answer: lock whatever was there.
function finalizePending(L){
  const now = Date.now(), el = Math.max(0, (now - L.start) / 1000);
  const lim = L.part === 'twist' ? L.twistLimit : L.limit;
  const part = { text:(L.text || '').trim(), secs:Math.min(lim, Math.max(1, Math.round(el))), limit:lim, timedOut: el >= lim };
  const inTwist = L.part === 'twist' && L.main;
  const main = inTwist ? L.main : part, follow = inTwist ? part : null;
  const rec = { q:L.q, mode:L.mode, text:main.text, audio:'', secs:main.secs, limit:main.limit, timedOut:main.timedOut,
    left:true, cut:true, pasteTries:L.pasteTries || 0, at:now,
    twist: follow ? { q:L.twistQ, text:follow.text, secs:follow.secs, limit:follow.limit, timedOut:follow.timedOut } : null };
  commit(L.ctx, L.matchId, L.openIdx, rec);
  clearLive();
  return rec;
}
function nextOnboardQuestion(){
  const plan = S.me.plan, i = S.me.answers.length;
  askQuestion({ ctx:'onboard', itemId:plan.ids[i], withTwist: i === plan.twistAt, mode:plan.mode, limit:45,
    label:`Question ${i + 1} of ${plan.ids.length}` });
}
function nextLabel(){
  if (Q.ctx === 'onboard') return S.me.ready ? 'See who is nearby' : `Go to question ${S.me.answers.length + 1}`;
  if (Q.ctx === 'fresh') return 'Back to my profile';
  return 'Open the chat';
}
function onLeave(){
  if (Q && Q.phase === 'live' && !Q.left) {
    Q.left = true;
    persistLive();
    const f = $('#leftflag'); if (f) f.hidden = false;
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) onLeave(); });
window.addEventListener('blur', onLeave);

/* ---------- chat ---------- */
function scriptedReply(id){
  const c = S.chats[id], p = person(id);
  if (!c || !p.replies || c.ri >= p.replies.length) return;
  setTimeout(() => {
    if (!S.chats[id] || S.blocked[id]) return;
    const m = { from:'them', text:p.replies[c.ri++] };
    c.msgs.push(m);
    // After their second reply, the match asks for a check-in once. It can be declined.
    const ask = c.ri === 2 && !c.msgs.some(x => x.kind === 'ask');
    if (ask) c.msgs.push({ from:'them', kind:'ask', state:'open' });
    save();
    if (view === 'chat' && chatId === id) {
      if (ask) { redraw(); return; }
      const box = $('#msgs');
      box.insertAdjacentHTML('beforeend', msgHtml(m));
      box.scrollTop = box.scrollHeight;
    }
  }, 1500);
}
// Add a right-now photo or voice note to a chat. Any open request counts as answered.
function sendNow(id, m){
  const c = S.chats[id];
  const open = c.msgs.filter(x => x.kind === 'ask' && x.state === 'open');
  c.msgs.push(m); open.forEach(x => { x.state = 'done'; });
  if (save()) return true;
  c.msgs.pop(); open.forEach(x => { x.state = 'open'; });
  return false;
}
async function endNote(send){
  if (!V || V.ending) return;
  V.ending = true;
  clearInterval(V.timer);
  const v = V, src = await recStop(v);
  V = null;
  if (sheet && sheet.type === 'voice') sheet = null;
  if (send && src && S.chats[v.id]) sendNow(v.id, { from:'me', kind:'voice', src, at:Date.now() });
  if (view === 'chat') redraw();
}

/* ---------- actions ---------- */
const ACT = {
  go(t){ go(t.dataset.to); },

  saveBasics(){
    const name = $('#f-name').value.trim(), age = Number($('#f-age').value), city = $('#f-city').value.trim();
    const iam = ($('input[name=iam]:checked') || {}).value, show = ($('input[name=show]:checked') || {}).value;
    const err = !name || name.length < 2 ? 'Add your first name.'
      : !Number.isInteger(age) || age < 18 ? 'You need to be 18 or older to use Offhand.'
      : age > 99 ? 'Check your age.'
      : !city ? 'Add your city.'
      : !iam || !show ? 'Choose an option for "I am" and "Show me".' : '';
    if (err) { $('#ferr').textContent = err; return; }
    S.me = { name, age, city, iam, show, answers:[], photo:'', photoAt:0, photoDone:false, plan:null, ready:false };
    save();
    P = { from:'onboard', shot:'', error:false, stream:null };
    go('photo');
  },

  snap(){ snap(); },
  camRetry(){ P.error = false; render(); },
  photoNext(){ const from = P.from; P = null; go(from === 'onboard' ? 'qintro' : 'me'); },
  skipPhoto(){ S.me.photoDone = true; save(); P = null; go('qintro'); },
  newPhoto(){
    if (photoWait()) return;
    P = { from:'me', shot:'', error:false, stream:null };
    go('photo');
  },

  beginQuestions(){
    const mode = ($('input[name=mode]:checked') || {}).value || 'text';
    S.me.plan = planOnboarding(mode);
    save();
    nextOnboardQuestion();
  },
  qStart(){ qStart(); },
  qLock(){ finishQuestion(false); },
  qNext(){
    const ctx = Q.ctx, id = Q.matchId;
    Q = null;
    if (ctx === 'onboard') { if (S.me.ready) go('discover'); else nextOnboardQuestion(); }
    else if (ctx === 'fresh') go('me');
    else { chatId = id; go('chat'); }
  },
  qLater(){ const ctx = Q.ctx; Q = null; go(ctx === 'fresh' ? 'me' : 'matches'); },

  freshQ(){
    const it = draw(pick(['A', 'A', 'D', 'E', 'E', 'C']));
    markSeen(it.id); save();
    askQuestion({ ctx:'fresh', itemId:it.id, withTwist: Math.random() < 0.5, mode:'text', limit:45, label:'Fresh question' });
  },

  like(t){
    const p = person(t.dataset.id);
    S.liked[p.id] = { i:Number(t.dataset.i), at:Date.now() };
    if (p.back) { S.matches.unshift(p.id); save(); matchId = p.id; go('matched'); }
    else { save(); render(); toast(`Like sent to ${p.name}.`); }
  },
  pass(t){ S.passed[t.dataset.id] = true; save(); render(); },
  unpass(){ S.passed = {}; save(); render(); },

  report(t){ sheet = { type:'report', id:t.dataset.id }; redraw(); },
  closeSheet(){ sheet = null; redraw(); },
  doReport(){ blockNow('Reported and blocked. Thank you.'); },
  doBlock(){ blockNow('Blocked.'); },

  openMatch(t){
    const id = t.dataset.id;
    if (S.chats[id]) { chatId = id; go('chat'); } else { matchId = id; go('matched'); }
  },
  opening(){
    const p = person(matchId), idx = Math.floor(Math.random() * p.openers.length);
    askQuestion({ ctx:'opening', matchId, openIdx:idx, q:p.openers[idx].q, mode:'text', limit:30, label:`Opening question with ${p.name}` });
  },
  send(){
    const box = $('#msg'), text = box.value.trim();
    if (!text) return;
    const m = { from:'me', text };
    S.chats[chatId].msgs.push(m); save();
    const list = $('#msgs');
    list.insertAdjacentHTML('beforeend', msgHtml(m));
    list.scrollTop = list.scrollHeight;
    box.value = ''; box.dispatchEvent(new Event('input'));
    box.focus();
    scriptedReply(chatId);
  },

  now(){ sheet = { type:'now', id:chatId }; redraw(); },
  askYes(){ sheet = { type:'now', id:chatId, reply:true }; redraw(); },
  askNo(t){
    const m = S.chats[chatId].msgs[Number(t.dataset.i)];
    if (m && m.kind === 'ask') { m.state = 'declined'; save(); }
    redraw();
  },
  nowPhoto(){ P = { from:'chat', shot:'', error:false, stream:null }; go('photo'); },
  async nowVoice(){
    if (V || voiceStarting) return;
    const id = chatId;
    let r;
    voiceStarting = true;
    try { r = await recStart(); }
    catch (e) { sheet = null; redraw(); toast("The microphone isn't available in this window."); return; }
    finally { voiceStarting = false; }
    V = Object.assign(r, { id, t0:Date.now(), ending:false });
    sheet = { type:'voice', id }; redraw();
    V.timer = setInterval(() => {
      if (!V) return;
      const left = Math.max(0, 10 - (Date.now() - V.t0) / 1000);
      const el = $('#vsecs'); if (el) el.textContent = fmtClock(Math.ceil(left));
      if (left <= 0) endNote(true);
    }, 100);
  },
  noteSend(){ endNote(true); },
  nowAsk(){
    const id = chatId, c = S.chats[id], p = person(id);
    c.askedAt = Date.now();
    c.msgs.push({ from:'sys', kind:'note', text:`You asked ${p.name} for a right-now check-in. They can say no.` });
    save(); sheet = null; redraw();
    setTimeout(() => {
      if (!S.chats[id] || S.blocked[id]) return;
      S.chats[id].msgs.push({ from:'them', kind:'photo', src:'', at:Date.now() });
      save();
      if (view === 'chat' && chatId === id) redraw();
    }, 2000);
  },

  reset(){
    if (!resetArmed) { resetArmed = true; render(); return; }
    try { localStorage.removeItem(KEY); } catch (e) {}
    clearLive();
    S = fresh(); resetArmed = false; Q = P = null; matchId = chatId = null; draft = null;
    go('welcome');
  }
};
function blockNow(msg){
  S.blocked[sheet.id] = true; save();
  sheet = null;
  go(view === 'chat' ? 'matches' : view);
  toast(msg);
}

app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (fn) fn(t, e);
});

/* ---------- start ---------- */
// Pick up exactly where this person left off. Nothing restarts.
function resume(){
  if (!S.me) return go('welcome');
  if (S.me.ready) return go('discover');
  if (!S.me.photoDone) { P = { from:'onboard', shot:'', error:false, stream:null }; return go('photo'); }
  if (!S.me.plan) return go('qintro');
  nextOnboardQuestion();
}
function boot(){
  const L = loadLive();
  if (L && L.start && S.me) {
    const rec = finalizePending(L);
    Q = { phase:'locked', ctx:L.ctx, matchId:L.matchId, record:rec, cut:true };
    view = 'question';
    render();
    return;
  }
  if (L) clearLive();
  resume();
}
boot();
</script>
