<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offhand</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17132C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23E5383B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Offhand: a night out shot on a disposable camera. Deep indigo night, flash-white paper,
   REC red for anything live, and an amber seven-segment date stamp burned into every photo.
   Layout: one phone-width column; on a computer it stands in the middle of a night backdrop. */
:root{
  --paper:#F4F2F7; --card:#FFFFFF; --ink:#1C1830; --ink-2:#4B4662; --muted:#7B758E; --line:#E4E0EB; --line-2:#CDC8DA;
  --rec:#E5383B; --rec-soft:#FDE7E7; --stamp:#FF9F2E; --warn:#93560B; --warn-soft:#FFF1DC; --here:#1FA463;
  --night:#17132C; --night-2:#231E3F; --night-3:#2F2952; --night-line:#3B3462; --on-night:#F6F4FB; --on-night-2:#B8B2CD;
  --backdrop:#0E0B1E;
  --shadow:0 1px 2px rgba(28,24,48,.06),0 10px 28px rgba(28,24,48,.08);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#100D1E; --card:#1B172F; --ink:#F3F1F9; --ink-2:#CBC5DC; --muted:#9791AE; --line:#2A2544; --line-2:#3B355B;
    --rec:#FF5256; --rec-soft:#3A1B26; --warn:#F2B75E; --warn-soft:#382A15; --here:#3DD68C;
    --night:#0C0A18; --night-2:#18142D; --night-3:#231E40; --night-line:#322C54;
    --backdrop:#06050D;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body[data-tone="night"]{background:var(--night)}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rec);outline-offset:3px}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* the column, and the night backdrop around it on a computer */
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--paper)}
.app[data-tone="night"]{background:var(--night);color:var(--on-night)}
.screen{display:flex;flex-direction:column;gap:20px;min-height:100vh;min-height:100dvh;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.app[data-tabs] .screen{padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
.screen.enter{animation:enter .3s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.aside{display:none}
@media (min-width:600px){
  body,body[data-tone="night"]{background:
    radial-gradient(480px circle at 10% 16%,rgba(255,159,46,.17),transparent 70%),
    radial-gradient(560px circle at 92% 26%,rgba(229,56,59,.15),transparent 70%),
    radial-gradient(520px circle at 80% 90%,rgba(126,110,255,.17),transparent 70%),
    radial-gradient(420px circle at 16% 86%,rgba(70,200,220,.10),transparent 70%),
    var(--backdrop);background-attachment:fixed}
  .app{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 40px 120px rgba(0,0,0,.55)}
}
@media (min-width:1120px){
  .aside{display:flex;flex-direction:column;gap:14px;position:fixed;top:50%;transform:translateY(-50%);left:max(48px,calc(50% - 220px - 400px));width:320px;color:var(--on-night)}
  .aside .wordmark{font-size:2.4rem}
  .aside p{color:var(--on-night-2);font-size:1.05rem;line-height:1.5}
  .aside .eyebrow{color:var(--on-night-2)}
}

/* type */
h1,h2{font-family:var(--display);font-stretch:78%;font-weight:800;letter-spacing:-.005em;text-wrap:balance}
h1{font-size:2.55rem;line-height:.98}
h2{font-size:1.9rem;line-height:1.02}
h3{font-size:1.05rem;font-weight:600;line-height:1.3}
.mega{font-family:var(--display);font-stretch:72%;font-weight:800;font-size:clamp(2.8rem,13.5vw,3.8rem);line-height:.9;text-transform:uppercase;letter-spacing:-.005em}
.mega em{font-style:normal;color:var(--stamp)}
.lede{color:var(--ink-2);font-size:1.06rem;line-height:1.5}
.fine{color:var(--muted);font-size:.85rem;line-height:1.45}
.eyebrow{display:flex;align-items:center;gap:7px;font:500 .72rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow.hot{color:var(--stamp)}
.app[data-tone="night"] .lede,.app[data-tone="night"] .fine,.app[data-tone="night"] .eyebrow:not(.hot){color:var(--on-night-2)}
.wordmark{display:inline-flex;align-items:center;gap:9px;font:800 1.45rem/1 var(--display);font-stretch:80%;letter-spacing:-.01em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rec);display:inline-block;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--rec) 22%,transparent)}
.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:.35}}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.intro{display:flex;flex-direction:column;gap:10px}
.push{margin-top:auto}

/* buttons */
.btn{appearance:none;border:0;border-radius:999px;min-height:56px;padding:0 24px;font:600 1.02rem/1.2 var(--body);display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;cursor:pointer;transition:transform .12s ease,background-color .15s ease,opacity .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.secondary{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--rec)}
.btn.rec{background:var(--rec);color:#fff}
.btn.light{background:var(--on-night);color:#17132C}
.btn.ghost-night{background:transparent;color:var(--on-night-2);box-shadow:inset 0 0 0 1.5px var(--night-line)}
.btn.small{min-height:44px;font-size:.95rem;padding:0 18px}
.btn.fit{width:auto}
.btn .ic.fill{fill:currentColor;stroke:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.iconbtn{appearance:none;width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:inherit;flex:none}
.iconbtn:hover{background:color-mix(in srgb,currentColor 9%,transparent)}
.iconbtn.outline{width:56px;height:56px;box-shadow:inset 0 0 0 1.5px var(--line-2);color:var(--ink-2)}

/* step progress */
.stephead{display:flex;flex-direction:column;gap:12px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ink)}
.app[data-tone="night"] .steps i{background:var(--night-line)}
.app[data-tone="night"] .steps i.on{background:var(--on-night)}

/* rules lists */
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.rules li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.rules .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.app[data-tone="night"] .rules .ico{background:var(--night-2);color:var(--on-night);box-shadow:none}
.rules b{display:block;font-weight:600;line-height:1.3}
.rules span{display:block;color:var(--ink-2);font-size:.93rem;line-height:1.45;margin-top:2px}
.app[data-tone="night"] .rules span{color:var(--on-night-2)}

/* welcome */
.hero-art{position:relative;height:300px}
.hero-art .shot{position:absolute;left:2%;top:4px;width:56%;margin:0;border-radius:16px;overflow:hidden;transform:rotate(-5deg);box-shadow:0 0 0 6px #fff,0 24px 50px rgba(0,0,0,.5)}
.hero-art .shot img{aspect-ratio:4/5;object-fit:cover;width:100%}
.hero-art .bubble{position:absolute;right:0;bottom:6px;width:66%;transform:rotate(3deg);background:#fff;color:#1C1830;border-radius:18px;padding:14px 16px;box-shadow:0 24px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:6px}
.bubble .bq{font-size:.78rem;color:#7B758E;line-height:1.3}
.bubble .ba{font-size:.98rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bubble .chip{background:#F4F2F7;color:#4B4662}
.hero-art .rectag{position:absolute;right:6%;top:14px;display:inline-flex;align-items:center;gap:7px;font:700 .72rem/1 var(--mono);letter-spacing:.14em;color:var(--on-night);background:rgba(255,255,255,.08);padding:8px 11px;border-radius:999px}

/* forms */
.form{display:flex;flex-direction:column;gap:18px}
.two{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>span,.field legend{font-weight:600;font-size:.9rem;color:var(--ink-2);padding:0}
fieldset.field{border:0;margin:0;padding:0}
.input{border:1.5px solid var(--line);background:var(--card);border-radius:14px;height:54px;padding:0 16px;width:100%;font-size:1.02rem;color:var(--ink)}
.input:focus{border-color:var(--ink);outline:none}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label,.modes label{cursor:pointer}
.seg input,.modes input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;border-radius:999px;padding:11px 17px;font-weight:500;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.seg input:checked+span{background:var(--ink);color:var(--paper);box-shadow:none}
.seg input:focus-visible+span,.modes input:focus-visible+.mc{outline:2px solid var(--rec);outline-offset:2px}
.err{color:var(--rec);font-weight:500;min-height:1.4em;font-size:.92rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes .mc{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);height:100%}
.modes .mc .ic{margin-bottom:4px}
.modes input:checked+.mc{box-shadow:inset 0 0 0 2px var(--ink)}
.modes .mc b{font-weight:600}
.modes .mc small{color:var(--muted);font-size:.83rem;line-height:1.35}

/* photos */
.cam{position:relative;aspect-ratio:4/5;max-height:52vh;border-radius:24px;overflow:hidden;background:#05040A;max-width:100%}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam video{transform:scaleX(-1)}
.tag{position:absolute;top:14px;left:14px;z-index:1;display:inline-flex;align-items:center;gap:7px;background:rgba(10,8,22,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font:500 .66rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:7px 10px;border-radius:999px}
.camerr{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;color:var(--on-night-2);font-size:.95rem;line-height:1.5}
.camerr b{display:block;color:var(--on-night);font-size:1.05rem;margin-bottom:8px}
.shutterwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.shutter{appearance:none;width:80px;height:80px;border-radius:50%;border:0;background:transparent;box-shadow:inset 0 0 0 4px #fff;display:grid;place-items:center;cursor:pointer;padding:0}
.shutter::after{content:"";width:64px;height:64px;border-radius:50%;background:#fff;transition:transform .12s ease}
.shutter:active::after{transform:scale(.88)}
.shutter.send::after{background:var(--rec)}
.shutter:disabled{opacity:.35;cursor:wait}
.hint{font:500 .72rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-2)}
.portrait{position:relative;margin:0;border-radius:24px;overflow:hidden;aspect-ratio:4/5;background:var(--night-2);max-width:100%}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 46% at 0% 100%,rgba(10,8,22,.82),rgba(10,8,22,.35) 55%,transparent 100%);pointer-events:none}
.portrait figcaption{position:absolute;left:20px;bottom:18px;z-index:1;color:#fff;display:flex;flex-direction:column;gap:3px}
.portrait figcaption b{font:800 2.2rem/1 var(--display);font-stretch:78%}
.portrait figcaption span{font-size:.92rem;color:rgba(255,255,255,.82)}
.nophoto{aspect-ratio:4/5;border-radius:24px;border:1.5px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;color:var(--muted)}
.nophoto b{display:block;color:var(--ink);margin-bottom:4px}
.who{display:flex;flex-direction:column;gap:2px}
.who p{color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:-6px}
.fact{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;line-height:1.3;color:var(--ink-2);background:var(--card);box-shadow:var(--shadow);padding:9px 14px;border-radius:999px}
.fact .ic{color:var(--rec)}

/* answers */
.answer{background:var(--card);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.aq{color:var(--muted);font-size:.9rem;font-weight:500;line-height:1.35}
.atext{font-size:1.16rem;line-height:1.42;overflow-wrap:anywhere;white-space:pre-wrap}
.atext.none{color:var(--muted);font-style:italic;font-size:1rem}
.atext.typing-now::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--rec);margin-left:2px;vertical-align:-.15em;animation:blink 1s steps(2,start) infinite}
.answer audio{width:100%;height:40px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{font-size:.74rem;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--paper);color:var(--ink-2);white-space:nowrap}
.chip.tc{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.72rem}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.solid{background:var(--card);box-shadow:var(--shadow)}
.replay{appearance:none;border:0;background:transparent;color:var(--ink-2);font:500 .68rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;cursor:pointer;margin-left:auto;box-shadow:inset 0 0 0 1.5px var(--line)}
.replay .ic{fill:currentColor;stroke:none}
.replay:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.replay:disabled{opacity:.55;cursor:default}
.twist{margin-top:4px;padding-top:14px;border-top:1px dashed var(--line-2);display:flex;flex-direction:column;gap:8px}
.twist .atext{font-size:1.05rem}
.likebtn{align-self:flex-end;display:inline-flex;align-items:center;gap:7px;border:0;background:var(--rec-soft);color:var(--rec);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;margin-top:2px;transition:background-color .15s ease,color .15s ease}
.likebtn .ic,.heart .ic{fill:currentColor;stroke:none}
.likebtn:hover{background:var(--rec);color:#fff}
.deckbar{display:flex;gap:10px;align-items:center}

/* questions */
.qbar{display:flex;align-items:center;justify-content:space-between;min-height:56px}
.live{display:inline-flex;align-items:center;gap:8px;font:700 .76rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--rec)}
.timecode{font:800 3.4rem/1 var(--display);font-stretch:72%;font-variant-numeric:tabular-nums;color:var(--on-night)}
.timecode.low{color:var(--rec)}
.bar{height:4px;border-radius:2px;background:var(--night-line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--on-night);transform-origin:left}
.bar.low i{background:var(--rec)}
.qtext{font-size:2.15rem;line-height:1.03}
.answerbox{background:var(--night-2);color:var(--on-night);border:0;border-radius:var(--r);padding:16px 18px;min-height:170px;width:100%;resize:none;font-size:1.15rem;line-height:1.45}
.answerbox::placeholder{color:var(--on-night-2);opacity:.75}
.answerbox:focus{outline:2px solid var(--night-line);outline-offset:0}
.qmeta{display:flex;justify-content:space-between;gap:10px;color:var(--on-night-2);font-size:.84rem}
.qmeta .flag{color:var(--stamp);font-weight:600;text-align:right}
.voice{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 16px;border-radius:var(--r);background:var(--night-2);text-align:center;color:var(--on-night-2)}
.voice b{color:var(--on-night)}
.wave{display:flex;align-items:center;gap:5px;height:56px}
.wave i{width:6px;height:14px;border-radius:3px;background:var(--rec);animation:wave 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:-.75s}.wave i:nth-child(3){animation-delay:-.3s}.wave i:nth-child(4){animation-delay:-.9s}
.wave i:nth-child(5){animation-delay:-.5s}.wave i:nth-child(6){animation-delay:-.15s}.wave i:nth-child(7){animation-delay:-.6s}
@keyframes wave{50%{height:52px}}
.recwrap{display:flex;flex-direction:column;align-items:center;gap:16px;margin:auto 0}
.recbtn{appearance:none;width:124px;height:124px;border-radius:50%;border:0;background:var(--rec);color:#fff;font:700 .82rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 0 0 7px var(--night),0 0 0 9px rgba(255,255,255,.2),0 20px 50px rgba(229,56,59,.45);transition:transform .12s ease}
.recbtn:active{transform:scale(.95)}

/* match */
.pair{position:relative;height:232px}
.pair figure{position:absolute;top:0;width:46%;aspect-ratio:4/5;margin:0;border-radius:16px;overflow:hidden;background:var(--night-2);box-shadow:0 0 0 5px #fff,0 24px 50px rgba(0,0,0,.5);display:grid;place-items:center}
.pair figure img{width:100%;height:100%;object-fit:cover}
.pair .p1{left:6%;top:12px;transform:rotate(-6deg)}
.pair .p2{right:6%;transform:rotate(5deg)}
.pair .initial{font:800 4.5rem/1 var(--display);font-stretch:78%;color:var(--on-night-2)}
.heart{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:var(--rec);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 5px var(--night),0 12px 30px rgba(229,56,59,.5)}
.words{display:flex;flex-direction:column;gap:10px}
.word{background:var(--night-2);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:7px}
.word p{color:var(--on-night);font-size:1rem;line-height:1.4;overflow-wrap:anywhere}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:12px 14px;border:0;background:var(--card);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);width:100%;text-align:left;cursor:pointer;min-width:0}
.item.static{cursor:default}
.item.off{opacity:.72}
.item .txt{min-width:0;flex:1}
.item .txt b{display:block;font-weight:600}
.item .txt span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.here,.away{width:8px;height:8px;border-radius:50%;flex:none}
.here{background:var(--here);box-shadow:0 0 0 3px color-mix(in srgb,var(--here) 20%,transparent)}
.away{background:var(--line-2)}
.pill{flex:none;font-size:.84rem;font-weight:600;padding:9px 14px;border-radius:999px;background:var(--rec);color:#fff}
.av{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--night-2)}
.av img{width:100%;height:100%;object-fit:cover}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:30px 20px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink)}
.livecard{display:flex;align-items:center;gap:14px;padding:16px 16px 16px 18px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.livecard .lc{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.livecard .lc b{font-weight:600}

// The amber seven-segment date stamp of a film camera, burned into the pixels of every photo.
const SEGS = { 0:'abcdef', 1:'bc', 2:'abdeg', 3:'abcdg', 4:'bcfg', 5:'acdfg', 6:'acdefg', 7:'abc', 8:'abcdefg', 9:'abcdfg' };
function segLayout(text, h){
  const W = h * 0.52, T = h * 0.13, G = h * 0.035, half = h / 2, v = half - T / 2 - 2 * G, rects = [];
  let x = 0;
  for (const ch of text) {

      const S = {
        a:[x + T + G, 0, W - 2 * T - 2 * G, T], g:[x + T + G, half - T / 2, W - 2 * T - 2 * G, T], d:[x + T + G, h - T, W - 2 * T - 2 * G, T],
        f:[x, T / 2 + G, T, v], b:[x + W - T, T / 2 + G, T, v], e:[x, half + G, T, v], c:[x + W - T, half + G, T, v]
      };
      for (const s of SEGS[ch]) rects.push(S[s]);
      x += W + h * 0.2;
    } else if (ch === ':') { rects.push([x, h * 0.26, T, T], [x, h * 0.62, T, T]); x += T + h * 0.2; }
    else if (ch === "'") { rects.push([x, 0, T, h * 0.3]); x += T + h * 0.18; }

}

// Every typed answer keeps how it was typed: each change and when it happened, not just the result.
// Others can watch it unfold, pauses and corrections included. Text read off another screen looks robotic.
function diffText(a, b){
  let s = 0;
  while (s < a.length && s < b.length && a[s] === b[s]) s++;
  let ea = a.length, eb = b.length;
  while (ea > s && eb > s && a[ea - 1] === b[eb - 1]) { ea--; eb--; }
  return [s, ea - s, b.slice(s, eb)];
}

  catch (e) { toast("Couldn't save on this device. Storage is full or blocked."); return false; }
}
const readJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const drop = k => { try { localStorage.removeItem(k); } catch (e) {} };
// A question in progress is written down as it happens, so closing or reloading can't restart it.
const loadLive = () => readJSON(LIVE_KEY), saveLive = v => writeJSON(LIVE_KEY, v), clearLive = () => drop(LIVE_KEY);

let S = load() || fresh();
if (!Array.isArray(S.seen)) S.seen = [];
if (!S.talks) S.talks = {};
if (!S.focus) S.focus = { stayed:0, total:0 };
delete S.chats;   // conversations are never stored any more

let P = null;          // photo being taken
let V = null;          // voice note being recorded

let liveUntil = 0, liveTick = null, knockTimer = null, knockTick = null, knockedThisSession = false, likeTimer = null, lastPartner = null;

const fits = p => !S.me || S.me.show === 'everyone' || (S.me.show === 'women' ? p.g === 'woman' : p.g === 'man');
const norm = (a, seed) => ({ q:a.q, text:a.a, secs:a.secs, limit:45, mode:'text', left:!!a.left, timedOut:!!a.timedOut,
  keys: a.a ? fakeKeys(a.a, seed, !!a.left) : null,
  twist: a.tw ? { q:a.tw.q, text:a.tw.a, secs:a.tw.secs, limit:15, timedOut:!!a.tw.timedOut } : null });
// One new profile photo a week, so a new photo can't be used as a retake.
function photoWait(){ return S.me && S.me.photo && Date.now() < S.me.photoAt + WEEK ? fmtDay(S.me.photoAt + WEEK) : ''; }
const talkRec = id => S.talks[id] || (S.talks[id] = { n:0, used:[], last:null });
const isLive = () => liveUntil > Date.now();

/* ---------- dealing questions ---------- */
function moment(){
  const d = new Date(), h = d.getHours();
  const part = h < 5 ? 'night' : h < 12 ? 'morning' : h < 17 ? 'afternoon' : h < 22 ? 'evening' : 'night';
  return { day:DAYS[d.getDay()], part, when: part === 'night' ? 'tonight' : `this ${part}` };
}
const textOf = it => typeof it.q === 'function' ? it.q(moment()) : it.q;
// A question you haven't had before, from one family if possible.
function draw(fam, also = []){
  const used = new Set([...S.seen, ...also]);
  const mine = new Set(S.me ? S.me.answers.map(a => a.q) : []);   // never one that's already on your profile
  const ok = it => !used.has(it.id) && !mine.has(textOf(it));
  let list = POOL.filter(it => it.fam === fam && ok(it));
  if (!list.length) list = POOL.filter(ok);
  return pick(list.length ? list : POOL);
}
function markSeen(id){ if (!S.seen.includes(id)) S.seen.push(id); }
// Three questions from three different families, always including one about right now.
function planOnboarding(mode){
  const a = Math.random() < 0.5 ? 'A' : 'E';
  const b = pick(['A', 'E', 'C'].filter(f => f !== a));
  const ids = [];
  for (const fam of ['D', a, b]) ids.push(draw(fam, ids).id);
  shuffle(ids);
  ids.forEach(markSeen);
  return { ids, twistAt: Math.floor(Math.random() * ids.length), mode };
}

/* ---------- no-paste guard ---------- */
function guard(el, onTry){
  let prev = el.value;
  const deny = e => { e.preventDefault(); if (onTry) onTry(); toast('Pasting is off. Type it yourself.'); };
  el.addEventListener('paste', deny);
  el.addEventListener('drop', deny);
  el.addEventListener('dragover', e => e.preventDefault());
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('beforeinput', e => { if (/^insertFrom(Paste|Drop|Yank)/.test(e.inputType || '')) deny(e); });
  el.addEventListener('input', e => {
    // A big jump in one event means text was injected rather than typed.
    if (el.value.length - prev.length > 30 && !e.isComposing) {
      el.value = prev;
      if (onTry) onTry();
      toast('That arrived all at once. Type it yourself.');
    }
    prev = el.value;
  });
}

/* ---------- shared pieces ---------- */
function emptyText(part, cut){
  return cut ? 'Left mid-answer, so nothing was kept.'
    : part.timedOut ? 'No answer before the clock ran out.' : 'Locked without an answer.';
}
function answerCard(a, extraHtml = ''){
  const chips = [
    `<span class="chip tc">${fmtClock(a.secs)} / ${fmtClock(a.limit)}</span>`,
    `<span class="chip">${a.mode === 'voice' ? 'Spoken, one take' : 'Typed live'}</span>`
  ];
  if (a.timedOut) chips.push('<span class="chip">Clock ran out</span>');
  if (a.left) chips.push('<span class="chip warn">Left the app while answering</span>');
  let replay = '';
  if (a.text && a.keys && a.keys.length) {
    const idx = REPLAYS.push({ keys:a.keys, text:a.text }) - 1, fixes = countFixes(a.keys);
    replay = `<button class="replay" data-act="replay" data-r="${idx}" aria-label="Watch this answer being typed">${I('play', 12)}Watch it typed${fixes ? ` · ${fixes} fix${fixes > 1 ? 'es' : ''}` : ' · no fixes'}</button>`;
  }
  const body = a.audio ? `<audio controls src="${a.audio}"></audio>`
    : a.text ? `<p class="atext">${esc(a.text)}</p>`
    : `<p class="atext none">${emptyText(a, a.cut)}</p>`;
  const t = a.twist;
  const tw = t ? `<div class="twist"><p class="eyebrow hot">${I('spark', 14)}Surprise follow-up</p><p class="aq">${esc(t.q)}</p>${
      a.audio ? '<p class="atext none">Answered in the same recording.</p>'
      : t.text ? `<p class="atext">${esc(t.text)}</p>`
      : `<p class="atext none">${emptyText(t, a.cut)}</p>`
    }<div class="meta"><span class="chip tc">${fmtClock(t.secs)} / ${fmtClock(t.limit)}</span>${t.timedOut ? '<span class="chip">Clock ran out</span>' : ''}</div></div>` : '';
  return `<article class="answer"><p class="aq">${esc(a.q)}</p>${body}<div class="meta">${chips.join('')}${replay}</div>${tw}${extraHtml}</article>`;
}
const avatar = p => `<span class="av"><img src="${avatarSrc(p)}" alt=""></span>`;
const stepHead = n => `<div class="stephead"><div class="steps">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div><p class="eyebrow">Step ${n} of 3</p></div>`;
const focusFact = (stayed, total) => `<div class="facts"><span class="fact">${I('focus', 16)}${total ? `Stayed till the end in ${stayed} of ${total} live conversations` : 'No live conversations yet'}</span></div>`;
function tabbar(){
  const waiting = S.matches.filter(id => !S.blocked[id] && !talkRec(id).n).length;
  const tab = (id, label, icon, extra = '') => `<button data-act="go" data-to="${id}" ${view === id ? 'aria-current="page"' : ''}><span class="tb">${I(icon)}</span>${label}${extra}</button>`;
  const mExtra = (isLive() ? '<span class="ld" aria-label="You are live"></span>' : '') + (waiting ? `<span class="n">${waiting}</span>` : '');
  return `<nav class="tabbar" aria-label="Main">${tab('discover', 'Discover', 'cards')}${tab('matches', 'Matches', 'chat', mExtra)}${tab('me', 'Me', 'user')}</nav>`;
}

}

  matches(){

function stageHtml(){

// The reply box stays the same element for the whole conversation, so typing and a phone's keyboard survive every turn.

// Update a running conversation in place instead of re-rendering the screen.
function paintTalk(){

function saidHtml(m){

function endedHtml(){

/* ---------- render ---------- */
const AFTER = {
  photo(){ if (!P.shot && !P.error) startCam(); },
  question(){
    if (Q.phase !== 'live') return;
    const ans = $('#ans');
    if (!ans) return;
    guard(ans, () => { Q.pasteTries++; persistLive(); });
    let prev = ans.value;
    ans.addEventListener('input', () => {
      // keep how it was typed, not just what was typed
      if (Q.part === 'main' && ans.value !== prev && Q.keys.length < 1500) Q.keys.push([Date.now() - Q.start, ...diffText(prev, ans.value)]);
      prev = ans.value;
      Q.text = ans.value;
      $('#chars').textContent = `${ans.value.length} characters`;
      persistLive();
    });
    ans.focus();
  },
  talk(){
    const say = $('#say');
    if (!say) return;
    say.value = T.text || '';
    guard(say);
    say.addEventListener('input', () => { if (T) T.text = say.value; });
    say.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); talkSend(false); } });
    talkTick();
    if (!sheet) { say.focus(); say.setSelectionRange(say.value.length, say.value.length); }
  }
};
function afterSheet(){
  if (!sheet || sheet.type !== 'like') return;
  const box = $('#likesay');
  box.value = sheet.text || '';
  guard(box);
  box.addEventListener('input', () => { if (sheet) sheet.text = box.value; });
  box.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); likeSend(false); } });
  likeTick();
  box.focus();
}
const themeColor = document.querySelector('meta[name="theme-color"]');

function render(){
  if (view !== 'photo') stopCam();
  const changed = view !== lastView;
  const tabs = TABS.includes(view), tone = NIGHT.includes(view) ? 'night' : 'day';
  REPLAYS = [];
  app.innerHTML = VIEWS[view]() + (tabs ? tabbar() : '') + (sheet ? sheetHtml() : '');
  app.dataset.view = view; app.dataset.tone = tone; document.body.dataset.tone = tone;
  if (tabs) app.dataset.tabs = '1'; else delete app.dataset.tabs;
  const screen = app.querySelector('.screen');
  if (screen && changed) screen.classList.add('enter');
  lastView = view;
  themeColor.content = getComputedStyle(document.documentElement).getPropertyValue(tone === 'night' ? '--night' : '--paper').trim();
  if (AFTER[view]) AFTER[view]();
  afterSheet();
  if (view === 'talk' && talking()) window.scrollTo(0, document.documentElement.scrollHeight);
  else if (changed || (view === 'talk' && T && T.phase === 'ended')) window.scrollTo(0, 0);
}
function go(to){
  view = to; sheet = null;
  if (to !== 'me') resetArmed = false;
  render();
}

/* ---------- camera ---------- */
async function startCam(){
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera API');
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:960} }, audio:false });
    const v = $('#vid');
    if (view !== 'photo' || !v || !P) { stream.getTracks().forEach(t => t.stop()); return; }
    P.stream = stream;
    v.srcObject = stream;
    v.addEventListener('loadedmetadata', () => { const b = $('#snap'); if (b) b.disabled = false; }, { once:true });
  } catch (e) {
    if (view === 'photo' && P) { P.error = true; render(); }
  }
}
function stopCam(){
  if (P && P.stream) { P.stream.getTracks().forEach(t => t.stop()); P.stream = null; }
}
// One shot. The photo is kept (or sent) the moment it's taken.
function snap(){
  const v = $('#vid');
  if (!P || P.shot || !v || !v.videoWidth) return;
  const live = P.from === 'live';
  const W = live ? 540 : 720, H = live ? 675 : 900, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const scale = Math.max(W / v.videoWidth, H / v.videoHeight);
  const sw = W / scale, sh = H / scale;
  ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);   // mirror, like the preview
  ctx.drawImage(v, (v.videoWidth - sw) / 2, (v.videoHeight - sh) / 2, sw, sh, 0, 0, W, H);
  ctx.restore();
  const at = Date.now();
  drawStamp(ctx, at, W, H);   // burned into the pixels, so it travels with the photo
  const shot = c.toDataURL('image/jpeg', live ? 0.72 : 0.82);
  stopCam();
  if (live) {
    P = null;
    if (T && T.phase === 'mine') { T.capturing = false; view = 'talk'; sendMine({ kind:'photo', src:shot }); }
    else go(T ? 'talk' : 'matches');
    return;
  }
  S.me.photo = shot; S.me.photoAt = at;
  if (P.from === 'onboard') S.me.photoDone = true;
  save();
  P.shot = shot;
  render();
}

/* ---------- audio ---------- */
// One-take recorder, shared by spoken answers and voice notes.
async function recStart(){
  const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  try {
    const r = { stream, chunks:[], rec:new MediaRecorder(stream, { audioBitsPerSecond:24000 }) };
    r.rec.ondataavailable = e => { if (e.data.size) r.chunks.push(e.data); };
    r.rec.start();
    return r;
  } catch (e) {
    stream.getTracks().forEach(t => t.stop());
    throw e;
  }
}
function recStop(r){
  return new Promise(resolve => {
    r.rec.onstop = () => {
      const blob = new Blob(r.chunks, { type: r.rec.mimeType || 'audio/webm' });
      r.stream.getTracks().forEach(t => t.stop());
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => resolve('');
      fr.readAsDataURL(blob);
    };
    r.rec.stop();
  });
}

/* ---------- profile questions ---------- */
function askQuestion(opts){
  Q = Object.assign({ phase:'ready', part:'main', q:'', twistQ:'', limit:45, twistLimit:15, mode:'text', left:false, pasteTries:0, text:'', keys:[], busy:false }, opts);
  view = 'question'; render();
}
function curLimit(){ return Q.part === 'twist' ? Q.twistLimit : Q.limit; }
function persistLive(){
  if (!Q || Q.phase !== 'live') return;
  saveLive({ ctx:Q.ctx, q:Q.q, twistQ:Q.twistQ, mode:Q.mode, limit:Q.limit, twistLimit:Q.twistLimit, part:Q.part, start:Q.start,
    main:Q.main || null, text:Q.text, left:Q.left, pasteTries:Q.pasteTries, keys:Q.keys });
}
async function qStart(){
  if (!Q || Q.phase !== 'ready' || Q.busy) return;
  Q.busy = true;
  if (Q.itemId) {
    const it = BY_ID.get(Q.itemId) || draw('E');
    Q.q = textOf(it);
    if (Q.withTwist) Q.twistQ = pick(it.f);
  }
  if (Q.mode === 'voice') {
    try { Q.vr = await recStart(); }
    catch (e) { Q.mode = 'text'; toast("The microphone isn't available. Type this one instead."); }
  }
  Q.phase = 'live'; Q.part = 'main'; Q.start = Date.now(); Q.text = ''; Q.keys = []; Q.busy = false;
  persistLive();
  render();
  Q.timer = setInterval(tick, 100);
}
function tick(){
  if (!Q || Q.phase !== 'live') return;
  const lim = curLimit(), left = Math.max(0, lim - (Date.now() - Q.start) / 1000);
  const secs = $('#secs'), bar = $('#bar');
  if (secs) {
    secs.textContent = fmtClock(Math.ceil(left));
    const low = left <= 10;
    secs.classList.toggle('low', low);
    $('#barwrap').classList.toggle('low', low);
    bar.style.transform = `scaleX(${left / lim})`;
  }
  if (left <= 0) finishQuestion(true);
}
async function finishQuestion(timedOut){
  if (!Q || Q.phase !== 'live' || Q.busy) return;
  Q.busy = true;
  clearInterval(Q.timer);
  const lim = curLimit();
  const used = Math.min(lim, Math.max(1, Math.round((Date.now() - Q.start) / 1000)));
  const ans = $('#ans');
  const part = { text: ans ? ans.value.trim() : '', secs:used, limit:lim, timedOut:!!timedOut };
  if (Q.part === 'main' && Q.twistQ) {
    // Straight into the follow-up: no pause, and a spoken answer keeps recording.
    Q.main = part; Q.part = 'twist'; Q.start = Date.now(); Q.text = ''; Q.busy = false;
    persistLive();
    render();
    Q.timer = setInterval(tick, 100);
    return;
  }
  const main = Q.part === 'twist' ? Q.main : part, follow = Q.part === 'twist' ? part : null;
  const audio = Q.mode === 'voice' && Q.vr ? await recStop(Q.vr) : '';
  const rec = { q:Q.q, mode:Q.mode, text:main.text, audio, secs:main.secs, limit:main.limit, timedOut:main.timedOut,
    left:Q.left, pasteTries:Q.pasteTries, at:Date.now(), keys: Q.mode === 'text' && main.text ? Q.keys : null,
    twist: follow ? { q:Q.twistQ, text:follow.text, secs:follow.secs, limit:follow.limit, timedOut:follow.timedOut } : null };
  commit(Q.ctx, rec);
  clearLive();
  Q.record = rec; Q.phase = 'locked';
  render();
}
// Store an answer the moment it locks, so there is nothing to go back to.
function commit(ctx, rec){
  if (!S.me) return;
  if (ctx === 'onboard') {
    S.me.answers.push(rec);
    if (S.me.plan && S.me.answers.length >= S.me.plan.ids.length) S.me.ready = true;
  } else if (ctx === 'fresh') {
    S.me.answers.unshift(rec);
  }
  save();
}
// The page was closed or reloaded mid-answer: lock whatever was there.
function finalizePending(L){
  const now = Date.now(), el = Math.max(0, (now - L.start) / 1000);
  const lim = L.part === 'twist' ? L.twistLimit : L.limit;
  const part = { text:(L.text || '').trim(), secs:Math.min(lim, Math.max(1, Math.round(el))), limit:lim, timedOut: el >= lim };
  const inTwist = L.part === 'twist' && L.main;
  const main = inTwist ? L.main : part, follow = inTwist ? part : null;
  const rec = { q:L.q, mode:L.mode, text:main.text, audio:'', secs:main.secs, limit:main.limit, timedOut:main.timedOut,
    left:true, cut:true, pasteTries:L.pasteTries || 0, at:now, keys: L.mode === 'text' && main.text && L.keys && L.keys.length ? L.keys : null,
    twist: follow ? { q:L.twistQ, text:follow.text, secs:follow.secs, limit:follow.limit, timedOut:follow.timedOut } : null };
  commit(L.ctx, rec);
  clearLive();
  return rec;
}
function nextOnboardQuestion(){
  const plan = S.me.plan, i = S.me.answers.length;
  askQuestion({ ctx:'onboard', itemId:plan.ids[i], withTwist: i === plan.twistAt, mode:plan.mode, limit:45,
    label:`Question ${i + 1} of ${plan.ids.length}` });
}
function nextLabel(){
  if (Q.ctx === 'onboard') return S.me.ready ? 'See who is nearby' : `Go to question ${S.me.answers.length + 1}`;
  return 'Back to my profile';
}
function onLeave(){
  if (Q && Q.phase === 'live' && !Q.left) {
    Q.left = true;
    persistLive();
    const f = $('#leftflag'); if (f) f.hidden = false;
  }
}

/* ---------- likes need your words ---------- */
function likeTick(){
  if (!sheet || sheet.type !== 'like') return;
  const left = Math.max(0, LIKE_SECS - (Date.now() - sheet.start) / 1000);
  const el = $('#likeclock');
  if (el) { el.textContent = fmtClock(Math.ceil(left)); el.classList.toggle('low', left <= 5); }
  if (left <= 0) likeSend(true);
}
function closeLike(){ clearInterval(likeTimer); likeTimer = null; sheet = null; }
function likeSend(timedOut){
  if (!sheet || sheet.type !== 'like') return;
  const box = $('#likesay'), said = (box ? box.value : sheet.text || '').trim();
  if (!said) {
    if (!timedOut) { toast('Say why first. No words, no like.'); return; }
    closeLike(); render(); toast('Nothing said, so no like was sent.');
    return;
  }
  const { id, i } = sheet;
  closeLike();
  const p = person(id);
  S.liked[id] = { i, at:Date.now(), said };
  if (p.back) { S.matches.unshift(id); save(); matchId = id; go('matched'); }
  else { save(); lastView = ''; render(); toast(`Like sent to ${p.name}, with your words.`); }
}

/* ---------- being here ---------- */
// You're live for a set time, and only while the app is open. Matches who are here can knock on you.
function goLive(silent){
  liveUntil = Date.now() + LIVE_MINS * 60000;
  knockedThisSession = false;
  clearInterval(liveTick);
  liveTick = setInterval(() => {
    const left = Math.max(0, Math.round((liveUntil - Date.now()) / 1000));
    const el = $('#livecd'); if (el) el.textContent = fmtClock(left);
    if (left <= 0) { goOffline(); if (TABS.includes(view)) toast("You're offline now. Go live again whenever you're here."); }
  }, 1000);
  scheduleKnock(15000 + Math.random() * 15000);
  if (!silent) { if (TABS.includes(view)) render(); toast(`You're live for ${LIVE_MINS} minutes.`); }
}
function goOffline(){
  const was = liveUntil;
  liveUntil = 0;
  clearInterval(liveTick); clearTimeout(knockTimer);
  if (sheet && sheet.type === 'knock') { clearInterval(knockTick); sheet = null; }
  if (was && TABS.includes(view)) render();
}
function scheduleKnock(ms){
  clearTimeout(knockTimer);
  knockTimer = setTimeout(() => {
    if (!isLive() || knockedThisSession) return;
    const free = TABS.includes(view) && !sheet && !talking() && !V;
    const who = S.matches.map(person).filter(p => p && p.here && p.openers && !S.blocked[p.id] && p.id !== lastPartner);
    if (!who.length) return;
    if (!free) return scheduleKnock(8000);
    knockedThisSession = true;
    sheet = { type:'knock', id:pick(who).id, until:Date.now() + KNOCK_SECS * 1000 };
    render();
    clearInterval(knockTick);
    knockTick = setInterval(() => {
      if (!sheet || sheet.type !== 'knock') { clearInterval(knockTick); return; }
      const left = Math.max(0, Math.ceil((sheet.until - Date.now()) / 1000));
      const el = $('#knockcd'); if (el) el.textContent = left;
      if (left <= 0) {
        const name = person(sheet.id).name;
        clearInterval(knockTick); sheet = null; render();
        toast(`You missed ${name}'s knock.`);
      }
    }, 250);
  }, ms);
}

/* ---------- live conversations ---------- */
// Only when both people are here, one person at a time, taking turns on a clock.
// Their words show once and vanish when you reply. Leaving ends it. Nothing is saved.
const talking = () => T && T.phase !== 'ended';
function saveTalkMarker(){ if (talking()) writeJSON(TALK_KEY, { id:T.id, start:T.start, msgs:T.msgs, at:Date.now() }); }
function talkStart(id, incoming){
  const p = person(id);
  if (!p || !p.openers || !p.here || talking()) return;
  if (!isLive()) goLive(true);   // starting a conversation means you're here
  knockedThisSession = true;
  const rec = talkRec(id);
  const unused = p.openers.map((_, i) => i).filter(i => !rec.used.includes(i));
  const openIdx = unused.length ? pick(unused) : Math.floor(Math.random() * p.openers.length);
  rec.used.push(openIdx); save();
  T = { id, p, start:Date.now(), phase: incoming ? 'opening' : 'knock', incoming:!!incoming, openIdx, q:p.openers[openIdx].q,
    theirs:null, mine:null, text:'', msgs:0, step:0, endArmed:false, capturing:false,
    // talked before? then you both answer two quick questions about last time
    recall:rec.recall || null, recallQs: rec.recall ? makeRecall(p, rec.recall) : null, ri:0, picked:null, score:0,
    theirLines:[], dealtQ:null, yourOpen:null };
  saveTalkMarker();
  sheet = null; view = 'talk';
  let beat = 0;
  T.clock = setInterval(() => {
    const el = $('#elapsed'); if (el && T) el.textContent = fmtClock(Math.floor((Date.now() - T.start) / 1000));
    if (++beat % 10 === 0) saveTalkMarker();
  }, 500);
  if (incoming) { afterJoin(); return; }
  render();
  T.knockTimer = setTimeout(() => { if (T && T.phase === 'knock') afterJoin(); }, 1700);
}
function afterJoin(){
  if (T.recallQs) startRecallQ();
  else { T.phase = 'opening'; beginTurn(); }
}
function beginTurn(){
  T.turnStart = Date.now(); T.endArmed = false;
  paintTalk();
  clearInterval(T.timer);
  T.timer = setInterval(talkTick, 100);
}

/* ---------- remember last time ---------- */
// Before talking to someone again, you both answer two quick questions about your last conversation.
// Messages show once and there's no history, so only real attention gets these right.
function makeRecall(p, R){
  const others = PEOPLE.filter(x => x.id !== p.id && x.openers);
  const options = (right, pool) => shuffle([right, ...shuffle([...new Set(pool)].filter(x => x && x !== right)).slice(0, 2)]);
  const qs = [{ q:`Last time you were asked “${R.q}” What did ${p.name} say?`, right:R.theirs, opts:options(R.theirs, others.flatMap(x => x.openers.map(o => o.a))) }];
  if (R.dealt) qs.push({ q:`${p.name} dealt you a question last time. Which one?`, right:R.dealt, opts:options(R.dealt, POOL.map(textOf)) });
  else if (R.line) qs.push({ q:`Which of these did ${p.name} say to you?`, right:R.line, opts:options(R.line, others.flatMap(x => x.replies)) });
  return qs;
}
function startRecallQ(){
  T.phase = 'recall'; T.qAt = Date.now(); T.picked = null;
  render();
  clearInterval(T.timer);
  T.timer = setInterval(recallTick, 100);
}
function recallTick(){
  if (!talking() || T.phase !== 'recall' || T.picked != null) return;
  const left = Math.max(0, RECALL_SECS - (Date.now() - T.qAt) / 1000);
  const el = $('#recallclock'); if (el) { el.textContent = fmtClock(Math.ceil(left)); el.classList.toggle('low', left <= 3); }
  if (left <= 0) recallPick(-1);
}
function recallPick(i){
  if (!talking() || T.phase !== 'recall' || T.picked != null) return;
  clearInterval(T.timer);
  const q = T.recallQs[T.ri];
  T.picked = i;
  if (i >= 0 && q.opts[i] === q.right) T.score++;
  render();
  T.recallNext = setTimeout(() => {
    if (!talking() || T.phase !== 'recall') return;
    T.ri++;
    if (T.ri < T.recallQs.length) { startRecallQ(); return; }
    // the example people remember about as well as they stay focused
    const p = T.p;
    T.theirScore = Math.min(T.recallQs.length, p.focus[0] / p.focus[1] >= 0.85 ? 2 : 1);
    T.phase = 'recalled'; render();
  }, 1500);
}
// Keep only what next time's recall questions need. None of it can be read back.
function keepForRecall(rec){
  if (T.msgs < 2) return;   // their opening answer was never seen
  rec.recall = { q:T.q, theirs:T.p.openers[T.openIdx].a, dealt:T.dealtQ || null, line:T.theirLines.length ? pick(T.theirLines) : null, yours:T.yourOpen || null };
}
function talkTick(){
  if (!T || (T.phase !== 'opening' && T.phase !== 'mine')) return;
  const left = Math.max(0, TURN - (Date.now() - T.turnStart) / 1000);
  const clock = $('#turnclock'), fill = $('#turnfill'), bar = $('#turnbar');
  if (clock) { clock.textContent = fmtClock(Math.ceil(left)); clock.classList.toggle('low', left <= 10); }
  if (fill) { fill.style.transform = `scaleX(${left / TURN})`; bar.classList.toggle('low', left <= 10); }
  if (left > 0) return;
  // time: whatever you've got goes, whether you're typing, recording or holding the camera
  if (V) { endVoice(true); return; }
  if (view === 'photo') { stopCam(); P = null; T.capturing = false; view = 'talk'; }
  talkSend(true);
}
function talkSend(timedOut){
  if (!T || (T.phase !== 'opening' && T.phase !== 'mine')) return;
  const box = view === 'talk' ? $('#say') : null;
  const text = (box ? box.value : T.text || '').trim();
  if (!text) {
    if (timedOut) talkEnd('quiet');
    else toast('Say something first. When the clock runs out, an empty turn ends the conversation.');
    return;
  }
  sendMine({ kind:'text', text });
}
function sendMine(m){
  clearInterval(T.timer);
  const afterOpening = T.phase === 'opening';
  if (afterOpening) T.yourOpen = m.kind === 'text' ? m.text : m.kind === 'photo' ? 'a right-now photo' : 'a voice note';
  T.mine = m; T.theirs = null; T.text = ''; T.msgs++; sheet = null;
  T.phase = 'their'; saveTalkMarker();
  view = 'talk'; paintTalk();
  theirTurn(afterOpening);
}
// Their side of the conversation: an answer, a line, a dealt question from the bank, a reaction, and so on.
function theirTurn(afterOpening){
  const p = T.p;
  let text, last = false, deal = false, k = -1;
  if (afterOpening) text = p.openers[T.openIdx].a;
  else {
    k = T.step++;
    if (k === 0) text = p.replies[0];
    else if (k === 1) { const it = draw(pick(['A', 'E', 'C', 'D'])); markSeen(it.id); save(); text = textOf(it); deal = true; }
    else if (k === 2) text = p.react;
    else if (k - 2 < p.replies.length) text = p.replies[k - 2];
    else { text = p.bye; last = true; }
  }
  // their own words are worth remembering next time; the dealt question and a quick reaction aren't
  const line = !afterOpening && !deal && !last && k !== 2;
  T.wait = setTimeout(() => {
    if (!talking() || T.phase !== 'their') return;
    // their words arrive as they type them; yours are gone once they reply
    T.mine = null; T.theirs = { shown:'', deal };
    paintTalk();
    let i = 0;
    T.typer = setInterval(() => {
      if (!talking()) return;
      i = Math.min(text.length, i + (Math.random() < 0.35 ? 2 : 1));
      T.theirs.shown = text.slice(0, i);
      const el = $('#theirs'); if (el) el.textContent = T.theirs.shown;
      if (i < text.length) return;
      clearInterval(T.typer);
      T.msgs++; saveTalkMarker();
      if (deal) T.dealtQ = text;
      if (line) T.theirLines.push(text);
      if (last) { T.byeDone = true; T.closeT = setTimeout(() => talkEnd('they'), 2800); }
      else { T.phase = 'mine'; beginTurn(); }
    }, 32);
  }, 1300 + Math.random() * 1500);
}
function stopTalkTimers(){
  [T.timer, T.typer, T.clock].forEach(clearInterval);
  [T.wait, T.knockTimer, T.closeT, T.blurTimer, T.disarm, T.recallNext].forEach(clearTimeout);
  if (V) { clearInterval(V.timer); recStop(V); V = null; }
}
function talkEnd(reason){
  if (!talking()) return;
  if (reason === 'left' && T.byeDone) reason = 'they';   // they'd already said goodbye
  stopTalkTimers();
  if (view === 'photo') { stopCam(); P = null; }
  const secs = Math.max(1, Math.round((Date.now() - T.start) / 1000));
  const rec = talkRec(T.id);
  rec.n++; rec.last = { at:Date.now(), secs, msgs:T.msgs, reason };
  keepForRecall(rec);
  // staying till the end means finishing it yourself or seeing them off, not leaving or going quiet
  S.focus.total++; if (reason === 'they' || reason === 'you') S.focus.stayed++;
  save(); drop(TALK_KEY);
  // still live: another match can knock later, just not the person you've just talked to
  lastPartner = T.id;
  if (isLive()) { knockedThisSession = false; scheduleKnock(25000 + Math.random() * 20000); }
  // if the page is closing, show why on the next visit
  if (reason === 'left') writeJSON(ENDED_KEY, { id:T.id, reason, secs, msgs:T.msgs });
  T = { id:T.id, p:T.p, phase:'ended', reason, secs, msgs:T.msgs };
  sheet = null; view = 'talk'; render();
}
// Stop a conversation without the summary screen (used when you report or block).
function talkAbort(){
  if (!talking()) return;
  stopTalkTimers();
  const rec = talkRec(T.id);
  rec.n++; rec.last = { at:Date.now(), secs:Math.max(1, Math.round((Date.now() - T.start) / 1000)), msgs:T.msgs, reason:'you' };
  S.focus.total++; S.focus.stayed++;
  save(); drop(TALK_KEY); T = null;
}
async function endVoice(send){
  if (!V || V.ending) return;
  V.ending = true; clearInterval(V.timer);
  const v = V, src = await recStop(v);
  V = null;
  if (sheet && sheet.type === 'voice') sheet = null;
  if (send && src && T && T.phase === 'mine') sendMine({ kind:'voice', src });
  else if (view === 'talk') render();
}

/* ---------- full focus ---------- */
// Switching away ends a live conversation and takes you offline. A brief loss of focus gets
// a few seconds' grace, and a camera or microphone permission prompt doesn't count.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  onLeave();
  if (talking()) talkEnd('left');
  goOffline();
});
window.addEventListener('blur', () => {
  onLeave();
  if (!talking() || T.capturing) return;
  clearTimeout(T.blurTimer);
  T.blurTimer = setTimeout(() => { if (talking() && !T.capturing && !document.hasFocus()) talkEnd('left'); }, 4000);
});
window.addEventListener('focus', () => { if (T) clearTimeout(T.blurTimer); });

/* ---------- actions ---------- */
const ACT = {
  go(t){ go(t.dataset.to); },

  saveBasics(){
    const name = $('#f-name').value.trim(), age = Number($('#f-age').value), city = $('#f-city').value.trim();
    const iam = ($('input[name=iam]:checked') || {}).value, show = ($('input[name=show]:checked') || {}).value;
    const err = !name || name.length < 2 ? 'Add your first name.'
      : !Number.isInteger(age) || age < 18 ? 'You need to be 18 or older to use Offhand.'
      : age > 99 ? 'Check your age.'
      : !city ? 'Add your city.'
      : !iam || !show ? 'Choose an option for "I am" and "Show me".' : '';
    if (err) { $('#ferr').textContent = err; return; }
    S.me = { name, age, city, iam, show, answers:[], photo:'', photoAt:0, photoDone:false, plan:null, ready:false };
    save();
    P = { from:'onboard', shot:'', error:false, stream:null };
    go('photo');
  },

  snap(){ snap(); },
  camRetry(){ P.error = false; render(); },
  photoNext(){ const from = P.from; P = null; go(from === 'onboard' ? 'qintro' : 'me'); },
  photoBack(){ stopCam(); P = null; if (T) T.capturing = false; go(talking() ? 'talk' : 'matches'); },
  skipPhoto(){ S.me.photoDone = true; save(); P = null; go('qintro'); },
  newPhoto(){
    if (photoWait()) return;
    P = { from:'me', shot:'', error:false, stream:null };
    go('photo');
  },

  beginQuestions(){
    const mode = ($('input[name=mode]:checked') || {}).value || 'text';
    S.me.plan = planOnboarding(mode);
    save();
    nextOnboardQuestion();
  },
  qStart(){ qStart(); },
  qLock(){ finishQuestion(false); },
  qNext(){
    const ctx = Q.ctx;
    Q = null;
    if (ctx === 'onboard') { if (S.me.ready) go('discover'); else nextOnboardQuestion(); }
    else go('me');
  },
  qLater(){ Q = null; go('me'); },

  freshQ(){
    const it = draw(pick(['A', 'A', 'D', 'E', 'E', 'C']));
    markSeen(it.id); save();
    askQuestion({ ctx:'fresh', itemId:it.id, withTwist: Math.random() < 0.5, mode:'text', limit:45, label:'Fresh question' });
  },

  replay(t){
    const r = REPLAYS[Number(t.dataset.r)], card = t.closest('.answer'), el = card && card.querySelector('.atext');
    if (!r || !el || card.dataset.playing) return;
    card.dataset.playing = '1'; t.disabled = true;
    // real rhythm at 1.5x, with very long pauses shortened so it stays watchable
    const times = []; let acc = 0, prev = 0;
    r.keys.forEach(([at]) => { acc += Math.min(Math.max(0, at - prev), 1800) / 1.5; prev = at; times.push(acc); });
    let text = '', i = 0;
    const t0 = performance.now();
    el.classList.add('typing-now'); el.textContent = '';
    const step = () => {
      if (!el.isConnected) return;
      const now = performance.now() - t0;
      while (i < r.keys.length && times[i] <= now) { const [, s, d, ins] = r.keys[i]; text = text.slice(0, s) + ins + text.slice(s + d); i++; }
      el.textContent = text;
      if (i < r.keys.length) { requestAnimationFrame(step); return; }
      el.classList.remove('typing-now'); el.textContent = r.text;
      delete card.dataset.playing; t.disabled = false;
    };
    requestAnimationFrame(step);
  },

  like(t){
    sheet = { type:'like', id:t.dataset.id, i:Number(t.dataset.i), start:Date.now(), text:'' };
    render();
    clearInterval(likeTimer); likeTimer = setInterval(likeTick, 100);
  },
  likeSend(){ likeSend(false); },
  pass(t){ S.passed[t.dataset.id] = true; save(); lastView = ''; render(); },

  report(t){ if (sheet && sheet.type === 'like') closeLike(); sheet = { type:'report', id:t.dataset.id }; render(); },
  closeSheet(){ if (sheet && sheet.type === 'like') closeLike(); sheet = null; render(); },
  doReport(){ blockNow('Reported and blocked. Thank you.'); },
  doBlock(){ blockNow('Blocked.'); },

  goLive(){ goLive(false); },
  goOffline(){ goOffline(); toast("You're offline."); },
  knockJoin(){ const id = sheet.id; clearInterval(knockTick); sheet = null; talkStart(id, true); },
  knockSkip(){ const name = person(sheet.id).name; clearInterval(knockTick); sheet = null; render(); toast(`You let ${name}'s knock pass.`); },

  talk(t){ talkStart(t.dataset.id); },
  talkSend(){ talkSend(false); },
  talkEnd(t){
    if (!talking()) return;
    if (!T.endArmed) {
      // change only the button, so a half-typed message isn't disturbed
      T.endArmed = true; t.textContent = 'Tap again to end';
      clearTimeout(T.disarm);
      T.disarm = setTimeout(() => { if (talking() && T.endArmed) { T.endArmed = false; const b = $('[data-act=talkEnd]'); if (b) b.textContent = 'End'; } }, 3000);
      return;
    }
    talkEnd('you');
  },
  talkDone(){ T = null; drop(ENDED_KEY); go('matches'); },
  recallPick(t){ recallPick(Number(t.dataset.i)); },
  recallGo(){ if (talking() && T.phase === 'recalled') { T.phase = 'opening'; beginTurn(); } },
  now(){ if (talking() && T.phase === 'mine') { sheet = { type:'now' }; render(); } },
  nowPhoto(){
    if (!talking() || T.phase !== 'mine') return;
    T.capturing = true;
    P = { from:'live', shot:'', error:false, stream:null };
    go('photo');
  },
  async nowVoice(){
    if (V || voiceStarting || !talking() || T.phase !== 'mine') return;
    const convo = T, turnAt = T.turnStart;
    voiceStarting = true; convo.capturing = true;
    let r;
    try { r = await recStart(); }
    catch (e) { convo.capturing = false; if (T === convo) { sheet = null; render(); } toast("The microphone isn't available here."); return; }
    finally { voiceStarting = false; }
    convo.capturing = false;
    // the permission prompt can outlast the turn: never start recording into a later turn
    if (T !== convo || !talking() || T.phase !== 'mine' || T.turnStart !== turnAt) {
      recStop(r);
      if (T === convo && view === 'talk') { sheet = null; render(); }
      return;
    }
    V = Object.assign(r, { t0:Date.now(), ending:false });
    sheet = { type:'voice' }; render();
    V.timer = setInterval(() => {
      if (!V) return;
      const left = Math.max(0, 10 - (Date.now() - V.t0) / 1000);
      const el = $('#vsecs'); if (el) el.textContent = fmtClock(Math.ceil(left));
      if (left <= 0) endVoice(true);
    }, 100);
  },
  noteSend(){ endVoice(true); },

  reset(){
    if (!resetArmed) { resetArmed = true; render(); return; }
    try { localStorage.removeItem(KEY); } catch (e) {}
    clearLive(); drop(TALK_KEY); drop(ENDED_KEY);
    goOffline(); closeLike();
    S = fresh(); resetArmed = false; Q = P = T = null; matchId = null;
    go('welcome');
  }
};
function blockNow(msg){
  const id = sheet.id;
  S.blocked[id] = true; save();
  sheet = null;
  if (T && T.id === id) { talkAbort(); T = null; go('matches'); }
  else { lastView = ''; go(view); }
  toast(msg);
}

app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (fn) fn(t, e);
});

/* ---------- start ---------- */
// Pick up exactly where this person left off. Nothing restarts.
function resume(){
  if (!S.me) return go('welcome');
  if (S.me.ready) return go('discover');
  if (!S.me.photoDone) { P = { from:'onboard', shot:'', error:false, stream:null }; return go('photo'); }
  if (!S.me.plan) return go('qintro');
  nextOnboardQuestion();
}
function boot(){
  const L = loadLive();
  if (L && L.start && S.me) {
    const rec = finalizePending(L);
    Q = { phase:'locked', ctx:L.ctx, record:rec, cut:true };
    view = 'question';
    render();
    return;
  }
  if (L) clearLive();
  // A live conversation that was open when the page closed counts as leaving it.
  const M = readJSON(TALK_KEY);
  drop(TALK_KEY);
  if (M && S.me && person(M.id)) {
    const secs = Math.max(1, Math.round(((M.at || M.start) - M.start) / 1000));
    const rec = talkRec(M.id);
    rec.n++; rec.last = { at:Date.now(), secs, msgs:M.msgs || 0, reason:'left' };
    S.focus.total++;
    save();
    T = { id:M.id, p:person(M.id), phase:'ended', reason:'left', secs, msgs:M.msgs || 0 };
    view = 'talk';
    render();
    return;
  }
  // a conversation that ended because the page was closed: say so once
  const E = readJSON(ENDED_KEY);
  drop(ENDED_KEY);
  if (E && S.me && person(E.id)) {
    T = { id:E.id, p:person(E.id), phase:'ended', reason:E.reason, secs:E.secs, msgs:E.msgs };
    view = 'talk';
    render();
    return;
  }
  resume();
}
boot();
</script>
</body>
</html>
